name: Update public pub data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pubs.json
        run: python scripts/update_pubs.py

      - name: Update sitemap and commit changed data
        run: |
          PUB_DATA_CHANGED=false

          if ! git diff --quiet -- pubs.json; then
            PUB_DATA_CHANGED=true
          fi

          if [ "$PUB_DATA_CHANGED" = true ]; then
            python -c '
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          sitemap = Path("sitemap.xml")
          text = sitemap.read_text(encoding="utf-8")

          today = datetime.now(ZoneInfo("Asia/Bangkok")).date().isoformat()

          patterns = [
              (
                  r"(<loc>https://www\.guinnessthailand\.com/</loc>\s*"
                  r"<lastmod>)[^<]+(</lastmod>)",
                  "homepage",
              ),
              (
                  r"(<loc>https://www\.guinnessthailand\.com/pubs\.html</loc>\s*"
                  r"<lastmod>)[^<]+(</lastmod>)",
                  "pub directory",
              ),
          ]

          for pattern, label in patterns:
              text, count = re.subn(
                  pattern,
                  rf"\g<1>{today}\2",
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not find {label} lastmod in sitemap.xml"
                  )

          sitemap.write_text(text, encoding="utf-8")
          print(f"Updated homepage and pub directory sitemap lastmod to {today}")
          '
          fi

          if [ -z "$(git status --porcelain -- pubs.json pubs.html sitemap.xml)" ]; then
            echo "No pub data or directory changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubs.json pubs.html sitemap.xml
          git commit -m "Update public pub data"
          git push

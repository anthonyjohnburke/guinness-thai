name: Update public pub data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pubs.json
        run: python scripts/update_pubs.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- pubs.json; then
            echo "No pub data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubs.json
          git commit -m "Update public pub data"
          git push

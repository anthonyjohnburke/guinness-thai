<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pints of Bangkok - Price Chart Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:"Open Sans",sans-serif}.wrap{width:min(1500px,calc(100% - 48px));margin:44px auto;text-align:left}h1{font-family:"Bebas Neue",sans-serif;font-size:2.25rem;margin:0 0 14px}.intro{color:rgba(255,255,255,.68);line-height:1.55;margin:0 0 30px}.head,.row{display:grid;grid-template-columns:minmax(250px,32%) minmax(0,1fr);gap:18px}.main{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:12px;align-items:center}.axis{position:relative;height:54px}.axis:after,.track{content:"";position:absolute;left:0;right:0;top:30px;height:2px;background:rgba(255,255,255,.11)}.lab{position:absolute;top:0;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.48);white-space:nowrap}.lab.l{left:0}.lab.r{right:0}.lab.a{transform:translateX(-50%);color:#d4af37;text-align:center}.tick{position:absolute;top:25px;width:1px;height:12px;background:rgba(255,255,255,.3)}.tick.l{left:0}.tick.r{right:0}.tick.a{width:2px;height:20px;top:21px;background:#d4af37}.row{min-height:50px;align-items:center;border-radius:8px}.row:hover{background:rgba(212,175,55,.045)}.name{min-width:0;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.area{color:rgba(255,255,255,.42);font-size:.9em}.plot{height:32px;position:relative}.track{top:15px}.avgline{position:absolute;top:-10px;bottom:-10px;width:1px;background:rgba(212,175,55,.36)}.dot{position:absolute;top:8px;width:15px;height:15px;border-radius:50%;background:#d4af37;border:3px solid #000;box-shadow:0 0 0 1px rgba(212,175,55,.72);transform:translateX(-50%)}.price{justify-self:end;font-weight:700;color:rgba(255,255,255,.84);white-space:nowrap}.fresh{display:inline-block;width:8px;height:8px;margin-left:7px;border-radius:50%;background:#8bc34a;box-shadow:0 0 8px rgba(139,195,74,.65)}.legend{margin-top:22px;color:rgba(255,255,255,.55);font-size:.82rem}.legend strong{color:#d4af37}
@media(max-width:768px){.wrap{width:calc(100% - 28px);margin:28px auto}.head,.row{grid-template-columns:1fr;gap:5px}.head>div:first-child{display:none}.main{grid-template-columns:minmax(0,1fr) 64px;gap:10px}.name{font-size:.92rem;padding-top:8px}.lab{font-size:.62rem}.axis{height:50px}}
</style></head><body><main class="wrap"><h1>Bangkok Guinness Price Watch</h1><p class="intro">Test chart: cheaper pints sit on the left, more expensive pints on the right, with the Bangkok average marked across every row.</p><div class="head"><div></div><div class="main"><div class="axis" id="axis"></div><div></div></div></div><div id="chart"></div><div class="legend"><strong>Gold dot</strong> = pint price. <span class="fresh"></span> = verified within the last 20 days.</div></main>
<script>
const URL="https://opensheet.elk.sh/1FENGaj61vr2_6BWbqnYL7k6lkANGIdcBpRciPQU3SOI/Sheet1";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fresh=d=>{if(!d)return false;const x=new Date(d);return !isNaN(x)&&(new Date()-x)/86400000<=20};
fetch(URL).then(r=>{if(!r.ok)throw Error("Could not load pub data");return r.json()}).then(rows=>{
const pubs=rows.filter(p=>p.price&&!isNaN(parseFloat(p.price))).map(p=>({name:p.name,area:p.area,price:parseFloat(p.price),date:p.last_updated})).sort((a,b)=>a.price-b.price);
const min=Math.min(...pubs.map(p=>p.price)),max=Math.max(...pubs.map(p=>p.price)),avg=Math.round(pubs.reduce((s,p)=>s+p.price,0)/pubs.length),span=Math.max(max-min,1),pos=v=>(v-min)/span*100,ap=pos(avg);
axis.innerHTML=`<div class="lab l">฿${min} Cheapest</div><div class="lab a" style="left:${ap}%">฿${avg} Average</div><div class="lab r">฿${max} Highest</div><i class="tick l"></i><i class="tick a" style="left:${ap}%"></i><i class="tick r"></i>`;
chart.innerHTML=pubs.map((p,i)=>`<div class="row"><div class="name">${i+1}. ${esc(p.name)} ${p.area?`<span class="area">${esc(p.area)}</span>`:""}</div><div class="main"><div class="plot"><div class="track"></div><div class="avgline" style="left:${ap}%"></div><div class="dot" style="left:${pos(p.price)}%" title="฿${p.price}"></div></div><div class="price">฿${p.price}${fresh(p.date)?'<span class="fresh"></span>':""}</div></div></div>`).join("");
}).catch(e=>chart.textContent=e.message);
</script></body></html>
